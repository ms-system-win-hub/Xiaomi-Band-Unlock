<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title data-i18n="title">小米环表解锁工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: oklch(0.45 0.2 260);
            --primary-foreground: oklch(0.98 0.001 280);
            --background: oklch(0.98 0.001 280);
            --foreground: oklch(0.15 0.01 280);
            --card: oklch(0.96 0.001 280);
            --card-foreground: oklch(0.15 0.01 280);
            --border: oklch(0.88 0.001 280);
            --input: oklch(0.96 0.001 280);
            --secondary: oklch(0.92 0.001 280);
            --secondary-foreground: oklch(0.25 0.01 280);
            --muted: oklch(0.88 0.001 280);
            --muted-foreground: oklch(0.45 0.01 280);
            --accent: oklch(0.65 0.2 60);
            --accent-foreground: oklch(0.98 0.001 280);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
        }
        
        input, textarea, select {
            background-color: var(--input);
            color: var(--foreground);
            border: 1px solid var(--border);
            border-radius: 0.35rem;
            padding: 0.75rem;
            font-family: inherit;
            font-size: 1rem;
            transition: all 150ms ease-out;
        }
        
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 2px rgba(74, 159, 216, 0.2);
        }
        
        button {
            cursor: pointer;
            transition: all 100ms ease-out;
            border: none;
            border-radius: 0.35rem;
            padding: 0.75rem 1rem;
            font-family: inherit;
            font-weight: 500;
        }
        
        button:active:not(:disabled) {
            transform: scale(0.95);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        header {
            border-bottom: 1px solid var(--border);
            background-color: rgba(250, 251, 253, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .container {
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem;
            max-width: 1280px;
        }
        
        @media (min-width: 640px) {
            .container {
                padding: 0 1.5rem;
            }
        }
        
        @media (min-width: 1024px) {
            .container {
                padding: 0 2rem;
            }
        }
        
        header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
        }
        
        .logo-section h1 {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .language-select {
            padding: 0.4rem 0.6rem;
            font-size: 0.875rem;
            border-radius: 0.35rem;
            background-color: var(--secondary);
            border: 1px solid var(--border);
            cursor: pointer;
            outline: none;
        }

        .version {
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }
        
        main {
            flex: 1;
            padding: 2rem 1rem;
        }
        
        .main-container {
            max-width: 56rem;
            margin: 0 auto;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        
        @media (min-width: 1024px) {
            .content-grid {
                grid-template-columns: 2fr 1fr;
            }
        }
        
        .card {
            background: linear-gradient(135deg, rgba(250, 251, 253, 0.9), rgba(245, 247, 250, 0.9));
            border: 1px solid var(--border);
            border-radius: 0.35rem;
            padding: 1.5rem;
            box-shadow: 0 0 20px rgba(74, 159, 216, 0.05), inset 0 1px 0 rgba(0, 0, 0, 0.02);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--foreground);
        }
        
        .form-group input {
            width: 100%;
        }
        
        .algorithm-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            background-color: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 0.35rem;
        }
        
        .algorithm-toggle-label {
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--foreground);
        }
        
        .toggle-switch {
            width: 2.5rem;
            height: 1.5rem;
            background-color: var(--border);
            border-radius: 9999px;
            position: relative;
            cursor: pointer;
            transition: background-color 200ms;
        }
        
        .toggle-switch.active {
            background-color: var(--primary);
        }
        
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 1.25rem;
            height: 1.25rem;
            background-color: white;
            border-radius: 50%;
            top: 0.125rem;
            left: 0.125rem;
            transition: left 200ms;
        }
        
        .toggle-switch.active::after {
            left: 1.125rem;
        }
        
        .button-group {
            display: flex;
            gap: 0.75rem;
            padding-top: 0.5rem;
        }
        
        .btn {
            padding: 0.75rem 1rem;
            border-radius: 0.35rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 100ms ease-out;
        }
        
        .btn-primary {
            flex: 1;
            background-color: var(--primary);
            color: var(--primary-foreground);
        }
        
        .btn-primary:hover:not(:disabled) {
            background-color: oklch(0.4 0.2 260);
        }
        
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--foreground);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background-color: var(--secondary);
        }
        
        .result-card {
            background-color: var(--card);
            border: 1px solid rgba(74, 159, 216, 0.3);
            border-radius: 0.35rem;
            padding: 1.5rem;
            box-shadow: 0 0 20px rgba(74, 159, 216, 0.1), inset 0 1px 0 rgba(0, 0, 0, 0.02);
            animation: slideInUp 300ms ease-out;
            margin-top: 1.5rem;
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        
        .result-header h3 {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--muted-foreground);
        }
        
        .algorithm-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            background-color: rgba(74, 159, 216, 0.15);
            color: var(--primary);
            border-radius: 9999px;
            font-weight: 500;
        }
        
        .result-code {
            background-color: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 0.35rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        
        .result-code code {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 0.1em;
        }
        
        .history-card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.35rem;
            padding: 1rem;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        
        .history-header h3 {
            font-weight: 500;
            font-size: 0.875rem;
        }
        
        .history-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 0.5rem;
            background-color: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 0.35rem;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
            transition: background-color 200ms;
        }
        
        .history-item:hover {
            background-color: rgba(74, 159, 216, 0.1);
        }
        
        .history-empty {
            text-align: center;
            color: var(--muted-foreground);
            font-size: 0.75rem;
            padding: 1rem;
        }
        
        footer {
            border-top: 1px solid var(--border);
            background-color: rgba(250, 251, 253, 0.5);
            margin-top: 2rem;
        }
        
        footer .container {
            padding: 1rem;
        }
        
        .footer-stats {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--muted-foreground);
        }
        
        @media (min-width: 768px) {
            .footer-stats {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }
        
        .footer-stats-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .copy-btn {
            background: none;
            border: none;
            color: var(--foreground);
            cursor: pointer;
            padding: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo-section">
                <h1 data-i18n="title">小米环表解锁工具</h1>
            </div>
            <div class="header-right">
                <select class="language-select" id="languageSelect" onchange="changeLanguage(this.value)">
                    <option value="zh-CN">简体中文</option>
                    <option value="zh-TW">繁體中文</option>
                    <option value="en">English</option>
                </select>
                <div class="version">v1.2</div>
            </div>
        </div>
    </header>

    <main>
        <div class="main-container">
            <div class="content-grid">
                <div>
                    <div class="card">
                        <div class="form-group">
                            <label for="mac" data-i18n="macLabel">MAC 地址</label>
                            <input type="text" id="mac" placeholder="例如: 00:11:22:33:44:55" data-i18n-placeholder="macPlaceholder">
                        </div>

                        <div class="form-group">
                            <label for="sn" data-i18n="snLabel">序列号 (SN)</label>
                            <input type="text" id="sn" placeholder="例如: ABCDE/1234567890" data-i18n-placeholder="snPlaceholder">
                        </div>

                        <div class="form-group">
                            <div class="algorithm-toggle">
                                <span class="algorithm-toggle-label" data-i18n="useNewAlgorithm">使用新算法</span>
                                <div class="toggle-switch" id="algorithmToggle" onclick="toggleAlgorithm()"></div>
                            </div>
                        </div>

                        <div id="errorMessage" style="display: none; padding: 0.75rem; background-color: rgba(184, 102, 102, 0.15); border: 1px solid rgba(184, 102, 102, 0.3); border-radius: 0.35rem; font-size: 0.875rem; color: oklch(0.65 0.2 20); margin-bottom: 1rem;">
                            <span id="errorText"></span>
                        </div>

                        <div class="button-group">
                            <button class="btn btn-primary" onclick="calculate()" data-i18n="calculateBtn">计算解锁码</button>
                            <button class="btn btn-secondary" onclick="clearForm()" data-i18n="clearBtn">清空</button>
                        </div>

                        <div id="resultContainer" style="display: none;">
                            <div class="result-card">
                                <div class="result-header">
                                    <h3 data-i18n="unlockCodeResult">解锁码</h3>
                                    <span class="algorithm-badge" id="algorithmBadge" data-i18n="oldAlgorithm">旧算法</span>
                                </div>
                                <div class="result-code">
                                    <code id="resultCode">0000000000</code>
                                    <button class="copy-btn" onclick="copyResult()" title="复制" data-i18n-title="copy">📋</button>
                                </div>
                                <button class="btn btn-primary" onclick="copyResult()" style="width: 100%;" data-i18n="copyBtn">复制解锁码</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="history-card">
                    <div class="history-header">
                        <h3 data-i18n="historyTitle">历史记录</h3>
                        <button onclick="clearHistory()" style="background: none; border: none; color: var(--foreground); cursor: pointer; padding: 0.25rem;" title="清空" data-i18n-title="clearHistory">✕</button>
                    </div>
                    <div class="history-list" id="historyList">
                        <div class="history-empty" data-i18n="historyEmpty">暂无记录</div>
                    </div>
                </div>
            </div>
        </div>
    </main>



    <script>
        // 国际化配置
        const i18n = {
            'zh-CN': {
                title: '小米环表解锁工具',
                macLabel: 'MAC 地址',
                macPlaceholder: '例如: 00:11:22:33:44:55',
                snLabel: '序列号 (SN)',
                snPlaceholder: '例如: ABCDE/1234567890',
                useNewAlgorithm: '使用新算法',
                calculateBtn: '计算解锁码',
                clearBtn: '清空',
                unlockCodeResult: '解锁码',
                oldAlgorithm: '旧算法',
                newAlgorithm: '新算法',
                copy: '复制',
                copyBtn: '复制解锁码',
                historyTitle: '历史记录',
                clearHistory: '清空',
                historyEmpty: '暂无记录',
                visitCountLabel: '访问次数:',
                totalVisitorsLabel: '访客总数:',
                uptimeLabel: '已运行:',
                inputRequired: '请输入 MAC 地址和序列号',
                copySuccess: '已复制到剪贴板',
                copyFail: '复制失败',
                confirmClearHistory: '确定要清空所有历史记录吗？',
                macError: 'MAC 地址应为 12 个十六进制字符',
                snError: '序列号长度不合法',
                load: '加载',
                days: '天',
                hours: '小时',
                minutes: '分钟'
            },
            'zh-TW': {
                title: '小米環表解鎖工具',
                macLabel: 'MAC 地址',
                macPlaceholder: '例如: 00:11:22:33:44:55',
                snLabel: '序列號 (SN)',
                snPlaceholder: '例如: ABCDE/1234567890',
                useNewAlgorithm: '使用新算法',
                calculateBtn: '計算解鎖碼',
                clearBtn: '清空',
                unlockCodeResult: '解鎖碼',
                oldAlgorithm: '舊算法',
                newAlgorithm: '新算法',
                copy: '複製',
                copyBtn: '複製解鎖碼',
                historyTitle: '歷史記錄',
                clearHistory: '清空',
                historyEmpty: '暫無記錄',
                visitCountLabel: '訪問次數:',
                totalVisitorsLabel: '訪客總數:',
                uptimeLabel: '已運行:',
                inputRequired: '請輸入 MAC 地址和序列號',
                copySuccess: '已複製到剪貼板',
                copyFail: '複製失敗',
                confirmClearHistory: '確定要清空所有歷史記錄嗎？',
                macError: 'MAC 地址應為 12 個十六進制字符',
                snError: '序列號長度不合法',
                load: '加載',
                days: '天',
                hours: '小時',
                minutes: '分鐘'
            },
            'en': {
                title: 'Xiaomi-Band_Watch-Unlock-Tool',
                macLabel: 'MAC Address',
                macPlaceholder: 'e.g., 00:11:22:33:44:55',
                snLabel: 'Serial Number (SN)',
                snPlaceholder: 'e.g., ABCDE/1234567890',
                useNewAlgorithm: 'Use New Algorithm',
                calculateBtn: 'Calculate Code',
                clearBtn: 'Clear',
                unlockCodeResult: 'Unlock Code',
                oldAlgorithm: 'Old Algorithm',
                newAlgorithm: 'New Algorithm',
                copy: 'Copy',
                copyBtn: 'Copy Unlock Code',
                historyTitle: 'History',
                clearHistory: 'Clear',
                historyEmpty: 'No history',
                visitCountLabel: 'Visits:',
                totalVisitorsLabel: 'Total Visitors:',
                uptimeLabel: 'Uptime:',
                inputRequired: 'Please enter MAC address and SN',
                copySuccess: 'Copied to clipboard',
                copyFail: 'Copy failed',
                confirmClearHistory: 'Are you sure you want to clear all history?',
                macError: 'MAC should be 12 hex characters',
                snError: 'Invalid SN length',
                load: 'Load',
                days: 'days',
                hours: 'hours',
                minutes: 'mins'
            }
        };

        let currentLang = localStorage.getItem('lang') || 'zh-CN';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            updateUI();
        }

        function updateUI() {
            const t = i18n[currentLang];
            
            // 更新带有 data-i18n 属性的元素
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            // 更新带有 data-i18n-placeholder 属性的元素
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });

            // 更新带有 data-i18n-title 属性的元素
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (t[key]) el.title = t[key];
            });

            // 更新下拉框的值
            document.getElementById('languageSelect').value = currentLang;
            
            // 更新动态内容
            updateHistoryDisplay();
            updateStats();
            
            // 更新算法徽章（如果可见）
            const badge = document.getElementById('algorithmBadge');
            if (badge) {
                badge.textContent = useNewAlgorithm ? t.newAlgorithm : t.oldAlgorithm;
            }
        }

        // SHA256 计算
        async function sha256(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return new Uint8Array(hashBuffer);
        }
        
        // 规范化 MAC 地址
        function normalizeMac(mac) {
            return mac
                .toUpperCase()
                .replace(/：/g, '')
                .replace(/:/g, '')
                .replace(/-/g, '')
                .replace(/ /g, '')
                .replace(/\./g, '');
        }
        
        // 规范化序列号
        function normalizeSn(sn) {
            return sn.toUpperCase().trim();
        }
        
        // 计算解锁码
        async function calculateUnlockCode(mac, sn, useNewAlgorithm) {
            const t = i18n[currentLang];
            const normalizedMac = normalizeMac(mac);
            const normalizedSn = normalizeSn(sn);
            
            if (normalizedMac.length !== 12 || !/^[0-9A-F]{12}$/.test(normalizedMac)) {
                throw new Error(t.macError);
            }
            
            if (normalizedSn.length === 0 || normalizedSn.length > 50) {
                throw new Error(t.snError);
            }
            
            let dataStr;
            if (useNewAlgorithm) {
                dataStr = normalizedSn + normalizedMac + 'XIAOMI';
            } else {
                dataStr = normalizedMac + normalizedSn + 'XIAOMI';
            }
            
            const hash = await sha256(dataStr);
            
            let code = '';
            for (let i = 0; i < 10; i++) {
                const digit = hash[i] % 0xa;
                code += digit.toString();
            }
            
            return code;
        }
        
        // 算法切换
        let useNewAlgorithm = false;
        function toggleAlgorithm() {
            useNewAlgorithm = !useNewAlgorithm;
            const toggle = document.getElementById('algorithmToggle');
            const t = i18n[currentLang];
            if (useNewAlgorithm) {
                toggle.classList.add('active');
                document.getElementById('algorithmBadge').textContent = t.newAlgorithm;
            } else {
                toggle.classList.remove('active');
                document.getElementById('algorithmBadge').textContent = t.oldAlgorithm;
            }
        }
        
        // 计算
        async function calculate() {
            const mac = document.getElementById('mac').value;
            const sn = document.getElementById('sn').value;
            const errorDiv = document.getElementById('errorMessage');
            const t = i18n[currentLang];
            
            errorDiv.style.display = 'none';
            
            if (!mac.trim() || !sn.trim()) {
                errorDiv.style.display = 'block';
                document.getElementById('errorText').textContent = t.inputRequired;
                return;
            }
            
            try {
                const code = await calculateUnlockCode(mac, sn, useNewAlgorithm);
                document.getElementById('resultCode').textContent = code;
                document.getElementById('algorithmBadge').textContent = useNewAlgorithm ? t.newAlgorithm : t.oldAlgorithm;
                document.getElementById('resultContainer').style.display = 'block';
                
                saveToHistory(mac, sn, code);
            } catch (err) {
                errorDiv.style.display = 'block';
                document.getElementById('errorText').textContent = err.message;
            }
        }
        
        // 复制结果
        async function copyResult() {
            const code = document.getElementById('resultCode').textContent;
            const t = i18n[currentLang];
            try {
                await navigator.clipboard.writeText(code);
                alert(t.copySuccess);
            } catch (err) {
                alert(t.copyFail);
            }
        }
        
        // 清空表单
        function clearForm() {
            document.getElementById('mac').value = '';
            document.getElementById('sn').value = '';
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
        }
        
        // 历史记录管理
        function saveToHistory(mac, sn, code) {
            let history = JSON.parse(localStorage.getItem('unlock_history') || '[]');
            history.unshift({
                mac: mac,
                sn: sn,
                code: code,
                algorithm: useNewAlgorithm ? 'new' : 'old',
                timestamp: new Date().toLocaleTimeString(currentLang === 'en' ? 'en-US' : 'zh-CN')
            });
            history = history.slice(0, 50);
            localStorage.setItem('unlock_history', JSON.stringify(history));
            updateHistoryDisplay();
        }
        
        function updateHistoryDisplay() {
            const history = JSON.parse(localStorage.getItem('unlock_history') || '[]');
            const historyList = document.getElementById('historyList');
            const t = i18n[currentLang];
            
            if (history.length === 0) {
                historyList.innerHTML = `<div class="history-empty">${t.historyEmpty}</div>`;
                return;
            }
            
            historyList.innerHTML = history.map((item, index) => `
                <div class="history-item">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                        <code style="color: var(--primary); font-weight: bold;">${item.code}</code>
                        <span style="background-color: rgba(74, 159, 216, 0.15); color: var(--primary); padding: 0 0.25rem; border-radius: 2px; font-size: 0.65rem;">${item.algorithm === 'new' ? (currentLang === 'en' ? 'New' : '新') : (currentLang === 'en' ? 'Old' : '旧')}</span>
                    </div>
                    <div style="color: var(--muted-foreground); margin-bottom: 0.25rem; font-size: 0.7rem;">${item.mac}</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="color: var(--muted-foreground); font-size: 0.7rem;">${item.timestamp}</span>
                        <button onclick="loadFromHistory(${index})" style="background: none; border: none; color: var(--primary); cursor: pointer; font-size: 0.7rem; padding: 0.25rem;">${t.load}</button>
                    </div>
                </div>
            `).join('');
        }
        
        function loadFromHistory(index) {
            const history = JSON.parse(localStorage.getItem('unlock_history') || '[]');
            const item = history[index];
            const t = i18n[currentLang];
            document.getElementById('mac').value = item.mac;
            document.getElementById('sn').value = item.sn;
            document.getElementById('resultCode').textContent = item.code;
            useNewAlgorithm = item.algorithm === 'new';
            const toggle = document.getElementById('algorithmToggle');
            if (useNewAlgorithm) {
                toggle.classList.add('active');
            } else {
                toggle.classList.remove('active');
            }
            document.getElementById('algorithmBadge').textContent = useNewAlgorithm ? t.newAlgorithm : t.oldAlgorithm;
            document.getElementById('resultContainer').style.display = 'block';
        }
        
        function clearHistory() {
            const t = i18n[currentLang];
            if (confirm(t.confirmClearHistory)) {
                localStorage.removeItem('unlock_history');
                updateHistoryDisplay();
            }
        }
        
        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            updateUI();
            setInterval(updateStats, 1000);
            
            document.getElementById('mac').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') calculate();
            });
            document.getElementById('sn').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') calculate();
            });
        });
        
        function updateStats() {
            const t = i18n[currentLang];
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString(currentLang === 'en' ? 'en-US' : 'zh-CN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            
            
            document.getElementById('visitCount').textContent = stats.visitCount;
            document.getElementById('totalVisitors').textContent = stats.totalVisitors;
            
            const elapsed = Date.now() - stats.firstVisit;
            const days = Math.floor(elapsed / (24 * 60 * 60 * 1000));
            const hours = Math.floor((elapsed % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
            const minutes = Math.floor((elapsed % (60 * 60 * 1000)) / (60 * 1000));
          
        }
    </script>
